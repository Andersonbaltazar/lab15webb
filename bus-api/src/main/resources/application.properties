# ─────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────
server.port=${PORT:8080}

# ─────────────────────────────────────────────
# Datasource (Supabase / PostgreSQL)
# Set via environment variables:
#   DB_URL      → jdbc:postgresql://<host>:5432/<db>?sslmode=require
#   DB_USERNAME → postgres user
#   DB_PASSWORD → postgres password
# ─────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/busdb?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ─────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─────────────────────────────────────────────
# Security – API Key
# Set via environment variable:  API_KEY
# ─────────────────────────────────────────────
app.security.api-key=${API_KEY:changeme-secret-key}

# ─────────────────────────────────────────────
# CORS – allowed origins (comma-separated)
# Set via environment variable:  CORS_ALLOWED_ORIGINS
# ─────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────
logging.level.com.lab15=INFO
